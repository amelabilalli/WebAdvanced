<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms HTML</title>
</head>
<body>
    <form>
        <label for="firstname">First name: </label>
        <input type="text" name="firstname" id="firstname"> <br>

        <label for="lastname">Last name: </label>
        <input type="text" name="lastname" id="lastname"> <br>

        <label for="email">Email: </label>
        <input type="email" name="email" id="email"> <br>

        <label for="password">Password: </label>
        <input type="password" name="password" id="password"> <br><br><br>

        <label>Gender: </label> <br>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>

        <input type="radio" name="gender" id="female" value="female">
        <label for="female">Female</label> <br><br>

        <label>Hobbies</label> <br>
        <input type="checkbox" name="gaming" id="football" value="Foootball">
        <label for="gaming">Gaming</label><br>
        <input type="checkbox" name="swimming" id="swimming" value="Swimming">
        <label for="swimming">Swimming</label><br>


        <input type="submit" name="submit" id="submit" value="Submit"> <br>

    </form>
</body>
</html>
